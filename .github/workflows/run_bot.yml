name: Run Bet Monitor Bot

on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:

env:
  # Ottimizza l'esecuzione per i server GitHub a metà 2026
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Chrome e dipendenze grafiche Linux
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable xvfb libxi6 libgconf-2-4

      - name: Installa le librerie Python
        run: |
          pip install pandas numpy beautifulsoup4 selenium webdriver-manager requests undetected-chromedriver

      - name: Pulisci residui cache Chromedriver (Previene Errore 100)
        run: |
          rm -rf ~/.local/share/undetected_chromedriver
          rm -rf ~/.wdm

      - name: Esegui lo Script sotto schermo virtuale
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
        run: xvfb-run --server-args="-screen 0 1920x1080x24" python AS_best_low.py
