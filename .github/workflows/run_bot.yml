name: Run Bet Monitor Bot

on:
  schedule:
    # Fà partire lo script ogni 20 minuti
    - cron: '*/20 * * * *'
  workflow_dispatch: # Ti permette di farlo partire anche a mano quando vuoi

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: Controlla il codice
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa Chrome
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Installa le librerie Python
        run: |
          pip install pandas numpy beautifulsoup4 selenium webdriver-manager requests undetected-chromedriver

      - name: Esegui lo Script
        env:
          TELEGRAM_TOKEN: ${{ secrets::TELEGRAM_TOKEN }}
        run: python AS_best_low.py
